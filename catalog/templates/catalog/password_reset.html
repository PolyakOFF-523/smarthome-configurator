{% extends 'catalog/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow">
            <div class="card-header bg-warning text-white text-center py-3">
                <i class="bi bi-envelope display-4 d-block mb-2"></i>
                <h3 class="mb-0">Восстановление пароля</h3>
                <small>Мы отправим инструкции на ваш email</small>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">
                    Забыли пароль? Введите ваш email, и мы отправим ссылку для восстановления.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" 
                               placeholder="your@email.com" required autofocus>
                    </div>
                    
                    <button type="submit" class="btn btn-warning btn-lg w-100">
                        <i class="bi bi-send"></i> Отправить инструкции
                    </button>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <a href="{% url 'login' %}" class="text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Вернуться ко входу
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
