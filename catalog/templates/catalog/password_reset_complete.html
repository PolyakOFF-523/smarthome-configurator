{% extends 'catalog/base.html' %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center py-3">
                <i class="bi bi-check-circle-fill display-4 d-block mb-2"></i>
                <h3 class="mb-0">Пароль успешно изменён!</h3>
            </div>
            <div class="card-body text-center p-4">
                <i class="bi bi-shield-check display-1 text-success mb-3 d-block"></i>
                <h4>Ваш пароль был изменён</h4>
                <p>Теперь вы можете войти в систему с новым паролем.</p>
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg mt-3">
                    <i class="bi bi-box-arrow-in-right"></i> Войти в систему
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
